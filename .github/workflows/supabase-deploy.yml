name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npx runs the `supabase` devDependency pinned in package-lock.json,
      # so CI uses the exact CLI version developers use locally.
      #
      # Pushes via the pooled connection string (Supavisor) rather than
      # `supabase link` + `--linked`: GitHub-hosted runners are IPv4-only,
      # and Supabase's direct DB host is IPv6-only, so linking can fail
      # intermittently in CI. The pooler is IPv4-reachable.
      - name: Push migrations
        run: npx supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --yes
